spring.application.name=task-d6-flights-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.hikari.maximum-pool-size=10

# Dates for route search: interpret YYYY-MM-DD boundaries in this zone
app.route-search.time-zone=UTC

# SpringDoc / Swagger UI (defaults work; explicit paths help avoid guessing the URL)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.schemas=bookings
spring.flyway.default-schema=bookings
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
